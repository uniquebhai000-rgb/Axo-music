name: Build AXO MUSIC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'AXOEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AXOMUSIC"
          include(":app")
          AXOEOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'AXOEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          AXOEOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'AXOEOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          AXOEOF
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'AXOEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val jamendoId: String = (project.findProperty("JAMENDO_CLIENT_ID") as String?)
              ?: System.getenv("JAMENDO_CLIENT_ID") ?: ""

          android {
              namespace = "com.axo.music"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.axo.music"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  buildConfigField("String", "JAMENDO_CLIENT_ID", "\"$jamendoId\"")
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-session:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-gson:2.11.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("com.google.guava:guava:33.2.1-android")
          }
          AXOEOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'AXOEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="AXO MUSIC"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".PlaybackService" android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          AXOEOF
          mkdir -p "$(dirname app/src/main/java/com/axo/music/Data.kt)"
          cat > app/src/main/java/com/axo/music/Data.kt <<'AXOEOF'
          package com.axo.music

          import retrofit2.Retrofit
          import retrofit2.converter.gson.GsonConverterFactory
          import retrofit2.http.GET
          import retrofit2.http.Query

          data class Track(
              val id: String,
              val name: String,
              val artist_name: String,
              val album_name: String? = null,
              val duration: Int = 0,
              val image: String? = null,
              val audio: String? = null,
              val audiodownload: String? = null,
              val audiodownload_allowed: Boolean? = null,
          )

          data class TracksResponse(val results: List<Track> = emptyList())

          interface JamendoApi {
              @GET("tracks/")
              suspend fun tracks(
                  @Query("client_id") clientId: String,
                  @Query("format") format: String = "json",
                  @Query("limit") limit: Int = 30,
                  @Query("search") search: String? = null,
                  @Query("tags") tags: String? = null,
                  @Query("order") order: String? = null,
                  @Query("imagesize") imageSize: Int = 500,
                  @Query("audioformat") audioFormat: String = "mp32",
                  @Query("audiodlformat") audioDlFormat: String = "mp32",
              ): TracksResponse
          }

          /** Catalog provider backed by Jamendo (Creative Commons licensed music, streaming allowed). */
          object Catalog {
              private val api: JamendoApi = Retrofit.Builder()
                  .baseUrl("https://api.jamendo.com/v3.0/")
                  .addConverterFactory(GsonConverterFactory.create())
                  .build().create(JamendoApi::class.java)

              private val id get() = BuildConfig.JAMENDO_CLIENT_ID

              val configured get() = id.isNotBlank()

              suspend fun trending() = api.tracks(id, order = "popularity_week").results.filter { !it.audio.isNullOrBlank() }
              suspend fun search(q: String) = api.tracks(id, search = q).results.filter { !it.audio.isNullOrBlank() }
              suspend fun byTag(tag: String) = api.tracks(id, tags = tag, order = "popularity_month").results.filter { !it.audio.isNullOrBlank() }
          }
          AXOEOF
          mkdir -p "$(dirname app/src/main/java/com/axo/music/PlaybackService.kt)"
          cat > app/src/main/java/com/axo/music/PlaybackService.kt <<'AXOEOF'
          package com.axo.music

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlaybackService : MediaSessionService() {
              private var session: MediaSession? = null

              override fun onCreate() {
                  super.onCreate()
                  val player = ExoPlayer.Builder(this)
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                              .setUsage(C.USAGE_MEDIA).build(), true
                      )
                      .setHandleAudioBecomingNoisy(true)
                      .build()
                  session = MediaSession.Builder(this, player).build()
              }

              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo) = session

              override fun onDestroy() {
                  session?.run { player.release(); release() }
                  session = null
                  super.onDestroy()
              }
          }
          AXOEOF           mkdir -p "$(dirname app/src/main/java/com/axo/music/MusicViewModel.kt)"
          cat > app/src/main/java/com/axo/music/MusicViewModel.kt <<'AXOEOF'
          package com.axo.music

          import android.app.Application
          import android.content.ComponentName
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.MoreExecutors
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          class MusicViewModel(app: Application) : AndroidViewModel(app) {
              private val prefs = app.getSharedPreferences("axo", Context.MODE_PRIVATE)
              private val gson = Gson()
              private var controller: MediaController? = null
              private var queue: List<Track> = emptyList()

              var trending by mutableStateOf<List<Track>>(emptyList())
              var chill by mutableStateOf<List<Track>>(emptyList())
              var electronic by mutableStateOf<List<Track>>(emptyList())
              var results by mutableStateOf<List<Track>>(emptyList())
              var loading by mutableStateOf(false)
              var error by mutableStateOf<String?>(null)
              var searched by mutableStateOf(false)

              var current by mutableStateOf<Track?>(null)
              var isPlaying by mutableStateOf(false)
              var position by mutableStateOf(0L)
              var duration by mutableStateOf(0L)
              var shuffle by mutableStateOf(false)
              var repeat by mutableStateOf(Player.REPEAT_MODE_OFF)
              var liked by mutableStateOf(loadLiked())

              init {
                  connect()
                  loadHome()
                  viewModelScope.launch {
                      while (true) {
                          controller?.let {
                              position = it.currentPosition
                              duration = it.duration.coerceAtLeast(0L)
                          }
                          delay(500)
                      }
                  }
              }

              private fun connect() {
                  val ctx = getApplication<Application>()
                  val token = SessionToken(ctx, ComponentName(ctx, PlaybackService::class.java))
                  val future = MediaController.Builder(ctx, token).buildAsync()
                  future.addListener({
                      val c = future.get()
                      controller = c
                      c.addListener(object : Player.Listener {
                          override fun onIsPlayingChanged(playing: Boolean) { isPlaying = playing }
                          override fun onMediaItemTransition(item: MediaItem?, reason: Int) {
                              current = queue.firstOrNull { it.id == item?.mediaId }
                          }
                      })
                  }, MoreExecutors.directExecutor())
              }

              fun loadHome() = viewModelScope.launch {
                  if (!Catalog.configured) {
                      error = "Add your free Jamendo client ID (see README) to load music."
                      return@launch
                  }
                  loading = true; error = null
                  try {
                      trending = Catalog.trending()
                      chill = Catalog.byTag("chillout")
                      electronic = Catalog.byTag("electronic")
                  } catch (e: Exception) { error = "Could not load music: ${e.message}" }
                  loading = false
              }

              fun search(q: String) = viewModelScope.launch {
                  if (q.isBlank() || !Catalog.configured) return@launch
                  loading = true; error = null; searched = true
                  try { results = Catalog.search(q) } catch (e: Exception) { error = "Search failed: ${e.message}" }
                  loading = false
              }

              fun play(list: List<Track>, index: Int) {
                  val c = controller ?: return
                  queue = list
                  val items = list.map { t ->
                      MediaItem.Builder().setMediaId(t.id).setUri(t.audio)
                          .setMediaMetadata(
                              MediaMetadata.Builder().setTitle(t.name).setArtist(t.artist_name)
                                  .setAlbumTitle(t.album_name)
                                  .setArtworkUri(t.image?.let { android.net.Uri.parse(it) }).build()
                          ).build()
                  }
                  c.setMediaItems(items, index, 0L)
                  c.prepare(); c.play()
                  current = list[index]
              }

              fun togglePlay() { controller?.let { if (it.isPlaying) it.pause() else it.play() } }
              fun next() { controller?.seekToNextMediaItem() }
              fun previous() { controller?.seekToPreviousMediaItem() }
              fun seekTo(ms: Long) { controller?.seekTo(ms) }
              fun skip(ms: Long) { controller?.let { it.seekTo((it.currentPosition + ms).coerceAtLeast(0)) } }
              fun toggleShuffle() { shuffle = !shuffle; controller?.shuffleModeEnabled = shuffle }
              fun cycleRepeat() {
                  repeat = when (repeat) {
                      Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
                      Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
                      else -> Player.REPEAT_MODE_OFF
                  }
                  controller?.repeatMode = repeat
              }

              fun toggleLike(t: Track) {
                  liked = if (liked.any { it.id == t.id }) liked.filterNot { it.id == t.id } else liked + t
                  prefs.edit().putString("liked", gson.toJson(liked)).apply()
              }

              private fun loadLiked(): List<Track> = try {
                  gson.fromJson(prefs.getString("liked", "[]"), object : TypeToken<List<Track>>() {}.type) ?: emptyList()
              } catch (e: Exception) { emptyList() }

              override fun onCleared() { controller?.release(); super.onCleared() }
          }
          AXOEOF
          mkdir -p "$(dirname app/src/main/java/com/axo/music/MainActivity.kt)"
          cat > app/src/main/java/com/axo/music/MainActivity.kt <<'AXOEOF'
          package com.axo.music

          import android.Manifest
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.ui.graphics.Color

          val Bg = Color(0xFF08070D)
          val Bg2 = Color(0xFF100D19)
          val Purple = Color(0xFF8B5CF6)
          val Neon = Color(0xFFA855F7)
          val Violet = Color(0xFFC084FC)
          val Subtle = Color(0xFFA5A0B2)

          class MainActivity : ComponentActivity() {
              private val vm: MusicViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Neon, secondary = Violet, background = Bg, surface = Bg2,
                              onBackground = Color.White, onSurface = Color.White
                          )
                      ) { AxoApp(vm) }
                  }
              }
          }
          AXOEOF
          mkdir -p "$(dirname app/src/main/java/com/axo/music/Screens.kt)"
          cat > app/src/main/java/com/axo/music/Screens.kt <<'AXOEOF'
          package com.axo.music

          import androidx.activity.compose.BackHandler
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material.icons.outlined.FavoriteBorder
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.media3.common.Player
          import coil.compose.AsyncImage

          private fun greeting(): String {
              val h = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
              return when { h < 12 -> "Good Morning"; h < 18 -> "Good Afternoon"; else -> "Good Evening" }
          }

          private fun fmt(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              return "%d:%02d".format(s / 60, s % 60)
          }

          @Composable
          fun AxoApp(vm: MusicViewModel) {
              var tab by remember { mutableIntStateOf(0) }
              var showPlayer by remember { mutableStateOf(false) }
              val bgBrush = Brush.verticalGradient(listOf(Color(0xFF1B1030), Bg, Bg))

              if (showPlayer && vm.current != null) {
                  BackHandler { showPlayer = false }
                  PlayerScreen(vm) { showPlayer = false }
                  return
              }

              Scaffold(
                  containerColor = Bg,
                  bottomBar = {
                      Column {
                          if (vm.current != null) MiniPlayer(vm) { showPlayer = true }
                          NavigationBar(containerColor = Bg2) {
                              listOf(
                                  Triple("Home", Icons.Default.Home, 0),
                                  Triple("Search", Icons.Default.Search, 1),
                                  Triple("Library", Icons.Default.LibraryMusic, 2),
                              ).forEach { (label, icon, i) ->
                                  NavigationBarItem(
                                      selected = tab == i, onClick = { tab = i },
                                      icon = { Icon(icon, label) }, label = { Text(label) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = Color.White, selectedTextColor = Neon,
                                          indicatorColor = Purple, unselectedIconColor = Subtle, unselectedTextColor = Subtle
                                      )
                                  )
                              }
                          }
                      }
                  }
              ) { pad ->
                  Box(Modifier.fillMaxSize().background(bgBrush).padding(pad)) {
                      when (tab) {
                          0 -> HomeScreen(vm)
                          1 -> SearchScreen(vm)
                          else -> LibraryScreen(vm)
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(vm: MusicViewModel) {
              LazyColumn(contentPadding = PaddingValues(vertical = 16.dp)) {
                  item {
                      Text("AXO MUSIC", color = Neon, fontWeight = FontWeight.Black, fontSize = 14.sp,
                          letterSpacing = 4.sp, modifier = Modifier.padding(horizontal = 16.dp))
                      Text(greeting(), fontSize = 28.sp, fontWeight = FontWeight.Bold,
                          modifier = Modifier.padding(horizontal = 16.dp))
                      Text("Feel Every Beat.", color = Subtle, modifier = Modifier.padding(start = 16.dp, bottom = 12.dp))
                  }
                  if (vm.loading) item { LinearProgressIndicator(Modifier.fillMaxWidth().padding(16.dp), color = Neon) }
                  vm.error?.let { e ->
                      item {
                          Column(Modifier.padding(16.dp)) {
                              Text(e, color = Violet)
                              Spacer(Modifier.height(8.dp))
                              Button(onClick = { vm.loadHome() }, colors = ButtonDefaults.buttonColors(containerColor = Purple)) { Text("Retry") }
                          }
                      }
                  }
                  item { Shelf("Trending Now", vm.trending, vm) }
                  item { Shelf("Chill Vibes", vm.chill, vm) }
                  item { Shelf("Electronic", vm.electronic, vm) }
              }
          }

          @Composable
          fun Shelf(title: String, tracks: List<Track>, vm: MusicViewModel) {
              if (tracks.isEmpty()) return
              Text(title, fontSize = 20.sp, fontWeight = FontWeight.Bold,
                  modifier = Modifier.padding(start = 16.dp, top = 16.dp, bottom = 8.dp))
              LazyRow(contentPadding = PaddingValues(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  itemsIndexed(tracks) { i, t ->
                      Column(Modifier.width(140.dp).clickable { vm.play(tracks, i) }) {
                          AsyncImage(t.image, t.name, contentScale = ContentScale.Crop,
                              modifier = Modifier.size(140.dp).clip(RoundedCornerShape(14.dp)).background(Bg2))
                          Text(t.name, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold,
                              modifier = Modifier.padding(top = 6.dp))
                          Text(t.artist_name, maxLines = 1, overflow = TextOverflow.Ellipsis, color = Subtle, fontSize = 12.sp)
                      }
                  }
              }
          }

          @Composable
          fun SearchScreen(vm: MusicViewModel) {
              var q by remember { mutableStateOf("") }
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  OutlinedTextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text("Songs, artists, genres") },
                      leadingIcon = { Icon(Icons.Default.Search, null) },
                      modifier = Modifier.fillMaxWidth(),
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                      keyboardActions = KeyboardActions(onSearch = { vm.search(q) }),
                      colors = OutlinedTextFieldDefaults.colors(focusedBorderColor = Neon, unfocusedBorderColor = Purple)
                  )
                  if (vm.loading) LinearProgressIndicator(Modifier.fillMaxWidth().padding(top = 8.dp), color = Neon)
                  vm.error?.let { Text(it, color = Violet, modifier = Modifier.padding(top = 8.dp)) }
                  if (vm.searched && !vm.loading && vm.results.isEmpty() && vm.error == null)
                      Text("No playable results found.", color = Subtle, modifier = Modifier.padding(top = 16.dp))
                  TrackList(vm.results, vm)
              }
          }

          @Composable
          fun TrackList(tracks: List<Track>, vm: MusicViewModel) {
              LazyColumn {
                  itemsIndexed(tracks) { i, t ->
                      Row(Modifier.fillMaxWidth().clickable { vm.play(tracks, i) }.padding(vertical = 8.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          AsyncImage(t.image, null, contentScale = ContentScale.Crop,
                              modifier = Modifier.size(54.dp).clip(RoundedCornerShape(10.dp)).background(Bg2))
                          Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                              Text(t.name, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold)
                              Text("${t.artist_name} • ${fmt(t.duration * 1000L)}", color = Subtle, fontSize = 12.sp,
                                  maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          IconButton(onClick = { vm.toggleLike(t) }) {
                              val on = vm.liked.any { it.id == t.id }
                              Icon(if (on) Icons.Default.Favorite else Icons.Outlined.FavoriteBorder, "Like",
                                  tint = if (on) Neon else Subtle)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LibraryScreen(vm: MusicViewModel) {
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Liked Songs", fontSize = 26.sp, fontWeight = FontWeight.Bold)
                  if (vm.liked.isEmpty()) Text("Tap the heart on any song to save it here.", color = Subtle,
                      modifier = Modifier.padding(top = 12.dp))
                  TrackList(vm.liked, vm)
              }
          }          @Composable
          fun MiniPlayer(vm: MusicViewModel, onOpen: () -> Unit) {
              val t = vm.current ?: return
              Column(Modifier.fillMaxWidth().background(Color(0xFF1A1228)).clickable { onOpen() }) {
                  val p = if (vm.duration > 0) vm.position.toFloat() / vm.duration else 0f
                  LinearProgressIndicator(progress = { p.coerceIn(0f, 1f) }, Modifier.fillMaxWidth().height(2.dp),
                      color = Neon, trackColor = Color.Transparent)
                  Row(Modifier.padding(horizontal = 12.dp, vertical = 6.dp), verticalAlignment = Alignment.CenterVertically) {
                      AsyncImage(t.image, null, contentScale = ContentScale.Crop,
                          modifier = Modifier.size(44.dp).clip(RoundedCornerShape(8.dp)))
                      Column(Modifier.weight(1f).padding(horizontal = 10.dp)) {
                          Text(t.name, maxLines = 1, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold)
                          Text(t.artist_name, maxLines = 1, overflow = TextOverflow.Ellipsis, color = Subtle, fontSize = 12.sp)
                      }
                      IconButton(onClick = { vm.togglePlay() }) {
                          Icon(if (vm.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow, "Play/Pause", tint = Color.White)
                      }
                      IconButton(onClick = { vm.next() }) { Icon(Icons.Default.SkipNext, "Next", tint = Color.White) }
                  }
              }
          }

          @Composable
          fun PlayerScreen(vm: MusicViewModel, onClose: () -> Unit) {
              val t = vm.current ?: return
              val glow by rememberInfiniteTransition(label = "glow").animateFloat(
                  0.35f, 0.9f, infiniteRepeatable(tween(1800), RepeatMode.Reverse), label = "g")
              val scale by animateFloatAsState(if (vm.isPlaying) 1f else 0.9f, tween(400), label = "s")
              var dragging by remember { mutableStateOf(false) }
              var dragPos by remember { mutableFloatStateOf(0f) }

              Column(
                  Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFF2A1450), Bg)))
                      .padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onClose) { Icon(Icons.Default.KeyboardArrowDown, "Close", tint = Color.White) }
                      Spacer(Modifier.weight(1f))
                      Text("NOW PLAYING", color = Violet, letterSpacing = 3.sp, fontSize = 12.sp)
                      Spacer(Modifier.weight(1f))
                      Spacer(Modifier.size(48.dp))
                  }
                  Spacer(Modifier.height(24.dp))
                  Box(Modifier.fillMaxWidth().aspectRatio(1f).padding(8.dp), contentAlignment = Alignment.Center) {
                      Box(Modifier.fillMaxSize(0.92f * scale).shadow(40.dp, RoundedCornerShape(24.dp),
                          ambientColor = Neon, spotColor = Neon).alpha(glow).background(Neon, RoundedCornerShape(24.dp)))
                      AsyncImage(t.image, t.name, contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize(0.9f * scale).clip(RoundedCornerShape(24.dp)).background(Bg2))
                  }
                  Spacer(Modifier.height(24.dp))
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text(t.name, fontSize = 22.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Text(t.artist_name, color = Subtle, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                      val on = vm.liked.any { it.id == t.id }
                      IconButton(onClick = { vm.toggleLike(t) }) {
                          Icon(if (on) Icons.Default.Favorite else Icons.Outlined.FavoriteBorder, "Like", tint = if (on) Neon else Subtle)
                      }
                  }
                  val dur = vm.duration.coerceAtLeast(1L).toFloat()
                  Slider(
                      value = if (dragging) dragPos else (vm.position / dur).coerceIn(0f, 1f),
                      onValueChange = { dragging = true; dragPos = it },
                      onValueChangeFinished = { vm.seekTo((dragPos * dur).toLong()); dragging = false },
                      colors = SliderDefaults.colors(thumbColor = Neon, activeTrackColor = Neon, inactiveTrackColor = Color(0xFF3A2D55))
                  )
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text(fmt(vm.position), color = Subtle, fontSize = 12.sp)
                      Text(fmt(vm.duration), color = Subtle, fontSize = 12.sp)
                  }
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { vm.toggleShuffle() }) {
                          Icon(Icons.Default.Shuffle, "Shuffle", tint = if (vm.shuffle) Neon else Subtle)
                      }
                      IconButton(onClick = { vm.previous() }) { Icon(Icons.Default.SkipPrevious, "Previous", Modifier.size(36.dp)) }
                      Box(Modifier.size(72.dp).clip(CircleShape).background(Brush.linearGradient(listOf(Purple, Neon)))
                          .clickable { vm.togglePlay() }, contentAlignment = Alignment.Center) {
                          Icon(if (vm.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow, "Play/Pause",
                              Modifier.size(40.dp), tint = Color.White)
                      }
                      IconButton(onClick = { vm.next() }) { Icon(Icons.Default.SkipNext, "Next", Modifier.size(36.dp)) }
                      IconButton(onClick = { vm.cycleRepeat() }) {
                          Icon(if (vm.repeat == Player.REPEAT_MODE_ONE) Icons.Default.RepeatOne else Icons.Default.Repeat, "Repeat",
                              tint = if (vm.repeat == Player.REPEAT_MODE_OFF) Subtle else Neon)
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(24.dp)) {
                      IconButton(onClick = { vm.skip(-10_000) }) { Icon(Icons.Default.Replay10, "Back 10s", tint = Subtle) }
                      IconButton(onClick = { vm.skip(10_000) }) { Icon(Icons.Default.Forward10, "Forward 10s", tint = Subtle) }
                  }
              }
          }
          AXOEOF
      - name: Build debug APK
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AXO-MUSIC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AXO MUSIC (latest build)
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
